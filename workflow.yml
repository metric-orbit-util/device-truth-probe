name: Device Truth Probe
on:
  repository_dispatch:
    types: [truth-probe]
  workflow_dispatch:
    inputs:
      lane:
        description: 'Measurement lane'
        required: false
        default: 'macos'
        type: choice
        options:
          - macos
          - ios
      burst:
        description: 'Number of samples to collect'
        required: false
        default: '6'

permissions:
  contents: write

jobs:
  measure:
    strategy:
      matrix:
        lane: [macos, ios]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Boot simulator (iOS)
        if: matrix.lane == 'ios'
        run: |
          xcrun simctl boot "iPhone 16" 2>/dev/null || true
          xcrun simctl list devices | head -20

      - name: Run probe
        env:
          TRUTH_LANE: ${{ matrix.lane }}
          TRUTH_BURST: ${{ inputs.burst || '6' }}
          TRUTH_PORT: '8234'
          TRUTH_OUT: 'samples'
        run: node runner.js

      - name: Commit samples
        run: |
          git config user.name "truth-bot"
          git config user.email "truth-bot@users.noreply.github.com"
          git checkout -b samples 2>/dev/null || git checkout samples
          git add samples/
          git diff --cached --quiet && echo "No new samples" && exit 0
          git commit -m "truth: ${{ matrix.lane }} ${{ github.run_id }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin samples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}